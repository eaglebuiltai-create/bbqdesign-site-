[project]
name = "polymarket-paper"
version = "0.1.0"
description = "Read-only Polymarket scanner for paper research. No orders and no private keys."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "polymarket-client>=0.17.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
polymarket-paper = "polymarket_paper.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
